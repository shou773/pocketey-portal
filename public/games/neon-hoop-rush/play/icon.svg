<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.85">
      <stop offset="0%" stop-color="#1a0a4a"/>
      <stop offset="55%" stop-color="#2a0855"/>
      <stop offset="100%" stop-color="#06061a"/>
    </radialGradient>
    <linearGradient id="rimC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5dd4ff"/>
      <stop offset="100%" stop-color="#1f9bff"/>
    </linearGradient>
    <linearGradient id="rimM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff63d6"/>
      <stop offset="100%" stop-color="#c41fb6"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#fff8e0"/>
      <stop offset="60%" stop-color="#ffd58a"/>
      <stop offset="100%" stop-color="#ffae00"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- grid lines suggestion -->
  <g stroke="rgba(255,99,214,0.18)" stroke-width="2" fill="none">
    <line x1="60" y1="430" x2="452" y2="430"/>
    <line x1="60" y1="380" x2="452" y2="380"/>
    <line x1="60" y1="340" x2="452" y2="340"/>
    <line x1="156" y1="468" x2="200" y2="280"/>
    <line x1="356" y1="468" x2="312" y2="280"/>
    <line x1="256" y1="468" x2="256" y2="280"/>
  </g>

  <!-- Back hoop (magenta) -->
  <g transform="translate(330 180)" filter="url(#glow)">
    <ellipse cx="0" cy="0" rx="64" ry="22" fill="none" stroke="url(#rimM)" stroke-width="9"/>
    <ellipse cx="0" cy="0" rx="56" ry="18" fill="rgba(196,31,182,0.18)"/>
  </g>

  <!-- Front hoop (cyan) -->
  <g transform="translate(176 270)" filter="url(#glow)">
    <ellipse cx="0" cy="0" rx="80" ry="28" fill="none" stroke="url(#rimC)" stroke-width="11"/>
    <ellipse cx="0" cy="0" rx="70" ry="22" fill="rgba(31,155,255,0.22)"/>
  </g>

  <!-- Ball trail -->
  <g filter="url(#glow)">
    <path
      d="M 360 380 Q 270 240 196 268"
      stroke="rgba(255,213,138,0.65)"
      stroke-width="6"
      stroke-linecap="round"
      fill="none"
      stroke-dasharray="2 16"
    />
  </g>

  <!-- Ball -->
  <g filter="url(#glow)">
    <circle cx="196" cy="268" r="22" fill="url(#ball)"/>
    <circle cx="190" cy="262" r="6" fill="rgba(255,255,255,0.85)"/>
  </g>
</svg>
