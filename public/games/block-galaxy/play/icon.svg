<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0%" stop-color="#3a1f7a"/>
      <stop offset="60%" stop-color="#0d0628"/>
      <stop offset="100%" stop-color="#070318"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9bf3ff"/>
      <stop offset="1" stop-color="#1199c8"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa8d6"/>
      <stop offset="1" stop-color="#c1228a"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7adff"/>
      <stop offset="1" stop-color="#4520b9"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4ffdc"/>
      <stop offset="1" stop-color="#3ec953"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- subtle stars -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="64" cy="80" r="2"/>
    <circle cx="430" cy="60" r="2.5"/>
    <circle cx="100" cy="420" r="2"/>
    <circle cx="450" cy="430" r="2.4"/>
    <circle cx="390" cy="170" r="1.8"/>
    <circle cx="120" cy="200" r="1.6"/>
    <circle cx="80" cy="320" r="2"/>
  </g>
  <!-- 4-block "tetromino L" arrangement, neon -->
  <g filter="url(#glow)">
    <rect x="124" y="124" width="112" height="112" rx="14" fill="url(#cyan)" stroke="rgba(255,255,255,0.55)" stroke-width="3"/>
    <rect x="244" y="124" width="112" height="112" rx="14" fill="url(#violet)" stroke="rgba(255,255,255,0.55)" stroke-width="3"/>
    <rect x="124" y="244" width="112" height="112" rx="14" fill="url(#pink)" stroke="rgba(255,255,255,0.55)" stroke-width="3"/>
    <rect x="244" y="244" width="112" height="112" rx="14" fill="url(#lime)" stroke="rgba(255,255,255,0.55)" stroke-width="3"/>
  </g>
  <!-- highlight strokes -->
  <g fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2.5">
    <line x1="140" y1="140" x2="220" y2="140"/>
    <line x1="260" y1="140" x2="340" y2="140"/>
    <line x1="140" y1="260" x2="220" y2="260"/>
    <line x1="260" y1="260" x2="340" y2="260"/>
  </g>
</svg>
