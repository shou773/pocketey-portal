<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aee8ff"/>
      <stop offset="1" stop-color="#cff4ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ed09c"/>
      <stop offset="1" stop-color="#5fa86d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky)"/>
  <rect y="180" width="600" height="220" fill="url(#grass)"/>
  <!-- arena ring -->
  <ellipse cx="300" cy="320" rx="280" ry="50" fill="rgba(0,0,0,0.18)"/>
  <ellipse cx="300" cy="318" rx="270" ry="44" fill="#66c187"/>
  <!-- weapon box -->
  <g transform="translate(120 230)">
    <rect x="0" y="0" width="42" height="42" rx="6" fill="#ffd84d" stroke="#1a1f3d" stroke-width="4"/>
    <text x="21" y="32" text-anchor="middle" font-size="28" font-weight="700" fill="#1a1f3d" font-family="ui-sans-serif, system-ui">?</text>
  </g>
  <g transform="translate(440 234)">
    <rect x="0" y="0" width="42" height="42" rx="6" fill="#ffd84d" stroke="#1a1f3d" stroke-width="4"/>
    <text x="21" y="32" text-anchor="middle" font-size="28" font-weight="700" fill="#1a1f3d" font-family="ui-sans-serif, system-ui">?</text>
  </g>
  <!-- title -->
  <g font-family="ui-sans-serif, system-ui, -apple-system" font-weight="800" text-anchor="middle">
    <text x="300" y="80" font-size="56" stroke="#1a1f3d" stroke-width="6" fill="#ffd84d" paint-order="stroke">CRITTER</text>
    <text x="300" y="138" font-size="56" stroke="#1a1f3d" stroke-width="6" fill="#ff7aa6" paint-order="stroke">KARTS</text>
  </g>
  <!-- left kart (fox) -->
  <g transform="translate(180 270)">
    <ellipse cx="0" cy="40" rx="60" ry="10" fill="rgba(0,0,0,0.25)"/>
    <rect x="-50" y="-2" width="100" height="34" rx="14" fill="#e88748" stroke="#1a1f3d" stroke-width="5"/>
    <rect x="-48" y="14" width="96" height="6" fill="#fff1de"/>
    <circle cx="-30" cy="32" r="14" fill="#1a1a1a"/>
    <circle cx="-30" cy="32" r="6" fill="#fff"/>
    <circle cx="30" cy="32" r="14" fill="#1a1a1a"/>
    <circle cx="30" cy="32" r="6" fill="#fff"/>
    <circle cx="0" cy="-30" r="32" fill="#e88748" stroke="#1a1f3d" stroke-width="5"/>
    <ellipse cx="-22" cy="-58" rx="8" ry="18" fill="#c9651f" stroke="#1a1f3d" stroke-width="4"/>
    <ellipse cx="22" cy="-58" rx="8" ry="18" fill="#c9651f" stroke="#1a1f3d" stroke-width="4"/>
    <circle cx="-12" cy="-32" r="4" fill="#1a1a1a"/>
    <circle cx="12" cy="-32" r="4" fill="#1a1a1a"/>
    <circle cx="0" cy="-22" r="3" fill="#1a1a1a"/>
    <path d="M -8 -14 Q 0 -8 8 -14" stroke="#1a1f3d" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- right kart (panda) -->
  <g transform="translate(420 280)">
    <ellipse cx="0" cy="40" rx="60" ry="10" fill="rgba(0,0,0,0.25)"/>
    <rect x="-50" y="-2" width="100" height="34" rx="14" fill="#fafafa" stroke="#1a1f3d" stroke-width="5"/>
    <rect x="-48" y="14" width="96" height="6" fill="#ffffff"/>
    <circle cx="-30" cy="32" r="14" fill="#1a1a1a"/>
    <circle cx="-30" cy="32" r="6" fill="#ff7aa6"/>
    <circle cx="30" cy="32" r="14" fill="#1a1a1a"/>
    <circle cx="30" cy="32" r="6" fill="#ff7aa6"/>
    <circle cx="0" cy="-30" r="32" fill="#fafafa" stroke="#1a1f3d" stroke-width="5"/>
    <circle cx="-22" cy="-58" r="14" fill="#1a1a1a" stroke="#1a1f3d" stroke-width="3"/>
    <circle cx="22" cy="-58" r="14" fill="#1a1a1a" stroke="#1a1f3d" stroke-width="3"/>
    <circle cx="-12" cy="-32" r="6" fill="#1a1a1a"/>
    <circle cx="12" cy="-32" r="6" fill="#1a1a1a"/>
    <circle cx="0" cy="-22" r="3" fill="#1a1a1a"/>
    <path d="M -8 -14 Q 0 -8 8 -14" stroke="#1a1f3d" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- banner badge -->
  <g transform="translate(300 360)" font-family="ui-sans-serif, system-ui" font-weight="700" text-anchor="middle">
    <rect x="-110" y="-22" width="220" height="40" rx="20" fill="#dc3a3a" stroke="#1a1f3d" stroke-width="4"/>
    <text x="0" y="6" font-size="18" fill="#fff">3-MIN BATTLE ARENA</text>
  </g>
</svg>
