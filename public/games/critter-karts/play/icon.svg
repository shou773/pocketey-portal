<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ed09c"/>
      <stop offset="1" stop-color="#5fb37e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- track ring -->
  <ellipse cx="256" cy="296" rx="180" ry="50" fill="#3d6a4a" opacity="0.45"/>
  <!-- kart body -->
  <g transform="translate(256 250)">
    <!-- shadow -->
    <ellipse cx="0" cy="60" rx="120" ry="22" fill="#000" opacity="0.25"/>
    <!-- chassis -->
    <rect x="-100" y="-30" width="200" height="80" rx="28" fill="#ffd84d" stroke="#1a1f3d" stroke-width="10"/>
    <!-- wheels -->
    <circle cx="-72" cy="55" r="28" fill="#1a1f3d"/>
    <circle cx="-72" cy="55" r="14" fill="#fff"/>
    <circle cx="72" cy="55" r="28" fill="#1a1f3d"/>
    <circle cx="72" cy="55" r="14" fill="#fff"/>
    <!-- critter head -->
    <circle cx="0" cy="-44" r="60" fill="#ffb56b" stroke="#1a1f3d" stroke-width="10"/>
    <!-- ears -->
    <circle cx="-42" cy="-86" r="20" fill="#ffb56b" stroke="#1a1f3d" stroke-width="8"/>
    <circle cx="42" cy="-86" r="20" fill="#ffb56b" stroke="#1a1f3d" stroke-width="8"/>
    <!-- eyes -->
    <circle cx="-22" cy="-48" r="8" fill="#1a1f3d"/>
    <circle cx="22" cy="-48" r="8" fill="#1a1f3d"/>
    <!-- mouth -->
    <path d="M -16 -26 Q 0 -16 16 -26" stroke="#1a1f3d" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- nose -->
    <circle cx="0" cy="-34" r="5" fill="#1a1f3d"/>
  </g>
</svg>
