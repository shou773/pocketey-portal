<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#4a3372"/>
      <stop offset="55%" stop-color="#2a1f43"/>
      <stop offset="100%" stop-color="#15101f"/>
    </radialGradient>
    <linearGradient id="cardR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8aa3"/>
      <stop offset="1" stop-color="#b21a3d"/>
    </linearGradient>
    <linearGradient id="cardY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe184"/>
      <stop offset="1" stop-color="#ffd454"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9bc4ff"/>
      <stop offset="1" stop-color="#1f4ea8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- soft warm glow -->
  <ellipse cx="256" cy="240" rx="200" ry="160" fill="#ffd454" opacity="0.13"/>

  <!-- back card (blue) -->
  <g transform="translate(140 130) rotate(-18 130 180)">
    <rect x="0" y="0" width="180" height="260" rx="24" fill="#fff" stroke="rgba(0,0,0,0.18)" stroke-width="2"/>
    <rect x="14" y="14" width="152" height="232" rx="18" fill="url(#cardB)"/>
    <ellipse cx="90" cy="130" rx="60" ry="100" fill="#ffffff" opacity="0.9" transform="rotate(-22 90 130)"/>
    <text x="90" y="155" font-family="Arial, sans-serif" font-size="100" font-weight="900" text-anchor="middle" fill="#1f4ea8">7</text>
  </g>

  <!-- middle card (yellow) -->
  <g transform="translate(170 110)">
    <rect x="0" y="0" width="180" height="260" rx="24" fill="#fff" stroke="rgba(0,0,0,0.18)" stroke-width="2"/>
    <rect x="14" y="14" width="152" height="232" rx="18" fill="url(#cardY)"/>
    <ellipse cx="90" cy="130" rx="60" ry="100" fill="#ffffff" opacity="0.9" transform="rotate(-22 90 130)"/>
    <text x="90" y="155" font-family="Arial, sans-serif" font-size="100" font-weight="900" text-anchor="middle" fill="#a87a00">3</text>
  </g>

  <!-- front card (red) -->
  <g transform="translate(200 130) rotate(14 90 130)">
    <rect x="0" y="0" width="180" height="260" rx="24" fill="#fff" stroke="rgba(0,0,0,0.18)" stroke-width="2"/>
    <rect x="14" y="14" width="152" height="232" rx="18" fill="url(#cardR)"/>
    <ellipse cx="90" cy="130" rx="60" ry="100" fill="#ffffff" opacity="0.9" transform="rotate(-22 90 130)"/>
    <text x="90" y="160" font-family="Arial, sans-serif" font-size="110" font-weight="900" text-anchor="middle" fill="#b21a3d">+2</text>
    <text x="32" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#b21a3d">+2</text>
  </g>

  <!-- chick avatar peeking from bottom-right -->
  <g transform="translate(360 370)">
    <ellipse cx="40" cy="55" rx="40" ry="35" fill="#ffd454" stroke="#a87a00" stroke-width="3"/>
    <circle cx="40" cy="32" r="28" fill="#ffe184" stroke="#a87a00" stroke-width="3"/>
    <circle cx="32" cy="30" r="4.5" fill="#222"/>
    <circle cx="48" cy="30" r="4.5" fill="#222"/>
    <circle cx="33.5" cy="28.5" r="1.5" fill="#fff"/>
    <circle cx="49.5" cy="28.5" r="1.5" fill="#fff"/>
    <polygon points="40,38 34,46 46,46" fill="#ff8a3c" stroke="#a04500" stroke-width="2"/>
  </g>

  <!-- bunny avatar peeking from bottom-left -->
  <g transform="translate(72 370)">
    <ellipse cx="32" cy="14" rx="6" ry="18" fill="#fff" stroke="#b21a3d" stroke-width="2.5"/>
    <ellipse cx="48" cy="14" rx="6" ry="18" fill="#fff" stroke="#b21a3d" stroke-width="2.5"/>
    <ellipse cx="32" cy="16" rx="3" ry="11" fill="#ff6b8a"/>
    <ellipse cx="48" cy="16" rx="3" ry="11" fill="#ff6b8a"/>
    <circle cx="40" cy="55" r="34" fill="#fff" stroke="#b21a3d" stroke-width="3"/>
    <circle cx="32" cy="50" r="4" fill="#222"/>
    <circle cx="48" cy="50" r="4" fill="#222"/>
    <circle cx="33" cy="49" r="1.4" fill="#fff"/>
    <circle cx="49" cy="49" r="1.4" fill="#fff"/>
    <ellipse cx="40" cy="60" rx="2.5" ry="1.5" fill="#ff6b8a"/>
  </g>

  <!-- title small -->
  <text x="256" y="475" font-family="Arial, sans-serif" font-size="50" font-weight="900" text-anchor="middle" fill="#ffd454" stroke="rgba(0,0,0,0.5)" stroke-width="3">Pawnos</text>
</svg>
