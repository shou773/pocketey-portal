<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#f4ecd8"/>
      <stop offset="100%" stop-color="#cfb997"/>
    </radialGradient>
    <linearGradient id="tofu" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#e8dcb8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- shadow under tower -->
  <ellipse cx="256" cy="430" rx="160" ry="20" fill="#7a6a4a" opacity="0.3"/>
  <!-- Tofu tower: 4 stacked blocks -->
  <g>
    <rect x="156" y="350" width="200" height="62" rx="8" fill="url(#tofu)" stroke="#b8a47b" stroke-width="3"/>
    <rect x="170" y="284" width="172" height="60" rx="8" fill="url(#tofu)" stroke="#b8a47b" stroke-width="3"/>
    <rect x="184" y="220" width="144" height="58" rx="8" fill="url(#tofu)" stroke="#b8a47b" stroke-width="3"/>
    <rect x="200" y="158" width="112" height="56" rx="8" fill="url(#tofu)" stroke="#b8a47b" stroke-width="3"/>
  </g>
  <!-- Tea leaf garnish on top -->
  <g transform="translate(256 145) rotate(-15)">
    <ellipse cx="0" cy="0" rx="18" ry="8" fill="#7ea08a"/>
    <ellipse cx="0" cy="0" rx="14" ry="5" fill="#5a8266" opacity="0.5"/>
  </g>
  <!-- Paper lanterns flanking -->
  <g transform="translate(80 110)">
    <rect x="-3" y="-40" width="6" height="40" fill="#3d2a17"/>
    <rect x="-26" y="0" width="52" height="48" rx="6" fill="#d97a3b"/>
    <rect x="-30" y="-2" width="60" height="6" fill="#3d2a17"/>
    <rect x="-30" y="48" width="60" height="6" fill="#3d2a17"/>
  </g>
  <g transform="translate(432 110)">
    <rect x="-3" y="-40" width="6" height="40" fill="#3d2a17"/>
    <rect x="-26" y="0" width="52" height="48" rx="6" fill="#d97a3b"/>
    <rect x="-30" y="-2" width="60" height="6" fill="#3d2a17"/>
    <rect x="-30" y="48" width="60" height="6" fill="#3d2a17"/>
  </g>
</svg>
