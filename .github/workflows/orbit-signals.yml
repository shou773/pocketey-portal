name: Orbit optional signals
on:
  pull_request:
    paths:
      - 'src/games/**'
      - 'src/components/ActionGame.astro'
      - 'tests/games/**'
      - 'scripts/capture-orbit-signals.mjs'
      - '.github/workflows/orbit-signals.yml'
permissions:
  contents: read
jobs:
  signals:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm run check:games && npm test && npm run build
      - name: Mark exact production source and file digests
        run: |
          git rev-parse HEAD > dist/preview-source-sha.txt
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-signals-dist-${{ github.event.pull_request.head.sha }}
          path: |
            dist/
            dist-sha256.txt
          retention-days: 14
      - run: npx playwright install --with-deps chromium
      - name: Optional and full-collection ordinary-input routes and records
        id: signals
        continue-on-error: true
        run: npx playwright test --config tests/games/signals.config.ts
      - name: Shared Amber gameplay and retained interruption/fallback checks
        id: regressions
        continue-on-error: true
        run: npx playwright test --grep 'amber-(keyboard|touch)|failure/retry|corrupt/blocked|WebGL context loss|simulated notch|failed GLBs|missing shared colormap'
      - name: Real production before/after and preserved-game file hashes
        id: captures
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/orbit-signal-baseline"
          git archive 190772d0a31e61caee9bab1fb0886209c96b873a | tar -x -C "$RUNNER_TEMP/orbit-signal-baseline"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/orbit-signal-baseline/node_modules"
          (cd "$RUNNER_TEMP/orbit-signal-baseline" && npm run build)
          node scripts/capture-orbit-signals.mjs "$RUNNER_TEMP/orbit-signal-baseline/dist"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit-signals-evidence
          path: test-results/
          retention-days: 14
      - name: Preserve every scoped gate result
        if: always()
        env:
          SIGNALS: ${{ steps.signals.outcome }}
          REGRESSIONS: ${{ steps.regressions.outcome }}
          CAPTURES: ${{ steps.captures.outcome }}
        run: |
          printf 'signals=%s regressions=%s captures=%s\n' "$SIGNALS" "$REGRESSIONS" "$CAPTURES"
          test "$SIGNALS" = success && test "$REGRESSIONS" = success && test "$CAPTURES" = success
