name: Validate Editorial Quality Fix

on:
  push:
    branches:
      - fix/editorial-quality-20260905

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile scripts/editorial_freshness.py scripts/editorial_guard.py scripts/editorial_image.py scripts/editorial_draft.py scripts/editorial_engine.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Astro site
        run: npm run build
