name: Pocketey Editorial Engine

on:
  workflow_dispatch:
  schedule:
    # 07:17 Japan Standard Time every day (22:17 UTC on the previous date).
    # A non-round minute reduces the chance of GitHub's scheduled-run peak delay.
    - cron: '17 22 * * *'

permissions:
  contents: write

concurrency:
  group: pocketey-editorial-engine
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Run editorial research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
        run: python scripts/editorial_engine.py

      - name: Apply deterministic candidate quality guard
        run: python scripts/editorial_guard.py

      - name: Generate or refresh unpublished article drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          DRAFT_LIMIT: 2
        run: python scripts/editorial_draft.py

      - name: Commit editorial queue and drafts
        run: |
          if [ -z "$(git status --porcelain -- data/editorial src/content/news)" ]; then
            echo "No editorial queue or draft changes to commit."
            exit 0
          fi
          git config user.name "pocketey-editorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/editorial src/content/news
          git commit -m "Add Pocketey editorial queue and drafts"
          git push
