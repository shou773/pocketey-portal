name: Pocketey Editorial Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run editorial research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: python scripts/editorial_engine.py

      - name: Commit editorial queue
        run: |
          if git diff --quiet -- data/editorial; then
            echo "No editorial queue changes to commit."
            exit 0
          fi
          git config user.name "pocketey-editorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/editorial
          git commit -m "Add Pocketey editorial queue"
          git push
