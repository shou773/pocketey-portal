name: Games quality
on:
  push:
    branches: [codex/orbit-and-amber, main]
    paths:
      - 'src/games/**'
      - 'src/pages/games/**'
      - 'src/components/ActionGame.astro'
      - 'src/components/Header.astro'
      - 'tests/games/**'
      - 'package*.json'
      - 'playwright.config.ts'
      - '.github/workflows/games-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:games && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: games-evidence
          path: |
            test-results/
