name: Games quality
on:
  push:
    branches: [codex/orbit-and-amber, codex/game-ui-refresh, codex/bilingual-game-portal, codex/3d-art-refresh, codex/four-game-release, main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/check-portal.mjs'
      - 'tests/portal/**'
      - 'playwright.portal.config.ts'
      - 'src/pages/games/**'
      - 'src/components/ActionGame.astro'
      - 'src/components/Header.astro'
      - 'tests/games/**'
      - 'tests/prototypes/**'
      - 'tests/release/**'
      - 'playwright.release.config.ts'
      - 'package*.json'
      - 'playwright.config.ts'
      - 'playwright.baseline.config.ts'
      - 'playwright.cross.config.ts'
      - 'scripts/games-performance.mjs'
      - '.github/workflows/games-quality.yml'
      - 'docs/games/ART-REFRESH.md'
      - 'docs/games/evidence/art-refresh/**'
      - 'docs/games/DIFFICULTY-REFRESH.md'
      - 'docs/games/AMBER-BUDGET.md'
      - 'docs/games/evidence/amber-budget/**'
      - 'docs/games/evidence/difficulty-refresh/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm run check:games && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Compare published main 711b53 and candidate on the same runner
        run: |
          mkdir -p "$RUNNER_TEMP/game-baseline"
          git archive 711b53dad512a5c09ac06d564ec5457e554f4ead | tar -x -C "$RUNNER_TEMP/game-baseline"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/game-baseline/node_modules"
          (cd "$RUNNER_TEMP/game-baseline" && npm run build)
          cp tests/games/browser.spec.ts tests/games/input.ts "$RUNNER_TEMP/game-baseline/tests/games/"
          node scripts/games-performance.mjs "$RUNNER_TEMP/game-baseline/dist" dist
      - name: Measure public baseline through the same ordinary-input stage-3 gates
        continue-on-error: true
        env:
          GAME_BASELINE_DIST: ${{ runner.temp }}/game-baseline/dist
        run: npx playwright test --config playwright.baseline.config.ts
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: games-evidence
          path: |
            test-results/
            performance-results/
            baseline-results/
  cross-browser:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps webkit firefox
      - run: xvfb-run --auto-servernum npx playwright test --config playwright.cross.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-browser-evidence
          path: cross-results/

  portal:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:portal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-evidence
          path: portal-results/

  new-games:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit firefox
      - name: Provide a real audio clock for Linux browser playback tests
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=pocketey_test_audio
          pactl set-default-sink pocketey_test_audio
          pactl info
      - id: audio
        continue-on-error: true
        run: npx playwright test --config playwright.release.config.ts
      - id: audio_cross
        continue-on-error: true
        run: xvfb-run --auto-servernum env RELEASE_CROSS=1 npx playwright test --config playwright.release.config.ts
      - id: tilt
        continue-on-error: true
        run: npx playwright test --config tests/prototypes/ball/playwright.config.ts
      - name: Pulse Drift ordinary keyboard/touch gameplay and lifecycle
        id: pulse
        continue-on-error: true
        run: |
          npm run preview -- --host 127.0.0.1 --port 4331 > /tmp/pulse-preview.log 2>&1 &
          for i in $(seq 1 30); do curl --silent --fail http://localhost:4331/ > /dev/null && break; sleep 1; done
          status=0
          node tests/prototypes/play.mjs || status=1
          node tests/prototypes/ui.mjs || status=1
          node tests/prototypes/loss.mjs || status=1
          node tests/prototypes/performance.mjs || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-game-audio-evidence
          path: test-results/

      - name: Aggregate all four-game gate failures without skipping another game
        if: always()
        env:
          AUDIO: ${{ steps.audio.outcome }}
          AUDIO_CROSS: ${{ steps.audio_cross.outcome }}
          TILT: ${{ steps.tilt.outcome }}
          PULSE: ${{ steps.pulse.outcome }}
        run: |
          printf 'audio=%s cross=%s tilt=%s pulse=%s\n' "$AUDIO" "$AUDIO_CROSS" "$TILT" "$PULSE"
          test "$AUDIO" = success && test "$AUDIO_CROSS" = success && test "$TILT" = success && test "$PULSE" = success
