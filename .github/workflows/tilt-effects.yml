name: TiltTrail effects review
on:
  push:
    branches: [codex/tilt-lightweight-effects]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm run check:games && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Build the unchanged six-game baseline
        run: |
          mkdir -p "$RUNNER_TEMP/tilt-baseline"
          git archive aed68c9933c281a62401535fb5822156cdb335d6 | tar -x -C "$RUNNER_TEMP/tilt-baseline"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/tilt-baseline/node_modules"
          (cd "$RUNNER_TEMP/tilt-baseline" && npm run build)
          git diff aed68c9933c281a62401535fb5822156cdb335d6 --name-only -- src public | tee /tmp/effects-source-files.txt
          test "$(wc -l < /tmp/effects-source-files.txt)" = 4
          ! git diff aed68c9933c281a62401535fb5822156cdb335d6 --name-only -- src public | grep -v -E '^src/(games/prototypes/ball/(app.ts|render.ts|style.css)|pages/games/tilttrail.astro)$'
      - name: Three alternating matched production samples
        id: comparison
        continue-on-error: true
        run: |
          npm run preview -- --host 127.0.0.1 --port 4335 > /tmp/tilt-candidate.log 2>&1 &
          (cd "$RUNNER_TEMP/tilt-baseline" && npm run preview -- --host 127.0.0.1 --port 4336 > /tmp/tilt-baseline.log 2>&1) &
          for port in 4335 4336; do for i in $(seq 1 30); do curl --silent --fail "http://127.0.0.1:$port/" > /dev/null && break; sleep 1; done; done
          node scripts/compare-tilt-effects.mjs
      - name: Scoped effects lifecycle and reduced-motion regressions
        id: effects
        continue-on-error: true
        run: npx playwright test --config tests/prototypes/ball/effects.config.ts
      - name: Unchanged six TiltTrail browser scenarios and performance gates
        id: original
        continue-on-error: true
        run: npx playwright test --config tests/prototypes/ball/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tilt-effects-review
          retention-days: 14
          path: |
            test-results/
            /tmp/tilt-candidate.log
            /tmp/tilt-baseline.log
      - name: Report all focused outcomes
        if: always()
        env:
          COMPARISON: ${{ steps.comparison.outcome }}
          EFFECTS: ${{ steps.effects.outcome }}
          ORIGINAL: ${{ steps.original.outcome }}
        run: |
          printf 'comparison=%s effects=%s unchanged=%s\n' "$COMPARISON" "$EFFECTS" "$ORIGINAL"
          test "$COMPARISON" = success && test "$EFFECTS" = success && test "$ORIGINAL" = success