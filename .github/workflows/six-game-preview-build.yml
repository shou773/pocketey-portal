name: Build isolated six-game preview artifact
on:
  push:
    branches: [codex/six-game-preview-build]
    paths: ['.github/workflows/six-game-preview-build.yml']
permissions:
  contents: read
jobs:
  preview-artifact:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2058422356a4051419b86df65d42985e832e7fd5
      - name: Confirm candidate source
        run: test "$(git rev-parse HEAD)" = 2058422356a4051419b86df65d42985e832e7fd5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Record exact source
        run: printf '%s\n' 2058422356a4051419b86df65d42985e832e7fd5 > dist/preview-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: six-game-preview-dist-2058422
          path: dist/
          if-no-files-found: error
          retention-days: 30
