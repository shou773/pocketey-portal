name: Alpine course campaign
on:
  pull_request:
    paths:
      - 'src/games/prototypes/alpine/**'
      - 'src/pages/prototypes/alpine-drive.astro'
      - 'tests/prototypes/alpine/**'
      - 'scripts/capture-alpine-campaign.mjs'
      - '.github/workflows/alpine-campaign.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  campaign:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CI: 'true'
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Preserve accepted integration outside exact-guarded retry help and compact header
        run: git diff --exit-code f39361caddbf992179f21edf62d59925dc214866 HEAD -- src public package.json package-lock.json 'astro.config.*' 'tsconfig*.json' ':(exclude)src/games/orbit-guidance.ts' ':(exclude)src/games/app.ts' ':(exclude)src/games/game.css' ':(exclude)src/games/prototypes/shooter/briefing.ts' ':(exclude)src/games/prototypes/shooter/app.ts'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm run check:games && npm test && npm run build
      - name: Mark exact production source and file digests
        run: |
          git rev-parse HEAD > dist/preview-source-sha.txt
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: alpine-campaign-dist-${{ github.event.pull_request.head.sha }}
          path: |
            dist/
            dist-sha256.txt
          retention-days: 14
      - run: npx playwright install --with-deps chromium
      - name: Three courses, precision, migration and compact native play
        id: campaign
        continue-on-error: true
        run: npx playwright test --config tests/prototypes/alpine/campaign.config.ts
      - name: Retained original input lifecycle and real-rendered clear
        id: retained
        continue-on-error: true
        run: npx playwright test --config tests/prototypes/alpine/playwright.config.ts && npx playwright test --config tests/prototypes/alpine/rendered.config.ts
      - name: Matched original-course comparison and new-course readability
        id: captures
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/alpine-campaign-baseline"
          git archive 2e1f9dad2ef4a74e2e43622b4cbc4d7f28455d8b | tar -x -C "$RUNNER_TEMP/alpine-campaign-baseline"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/alpine-campaign-baseline/node_modules"
          (cd "$RUNNER_TEMP/alpine-campaign-baseline" && npm run build)
          npx tsx scripts/capture-alpine-campaign.mjs "$RUNNER_TEMP/alpine-campaign-baseline/dist"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpine-campaign-evidence
          path: test-results/
          retention-days: 14
      - name: Preserve every scoped check result
        if: always()
        env:
          CAMPAIGN: ${{ steps.campaign.outcome }}
          RETAINED: ${{ steps.retained.outcome }}
          CAPTURES: ${{ steps.captures.outcome }}
        run: |
          printf 'campaign=%s retained=%s captures=%s\n' "$CAMPAIGN" "$RETAINED" "$CAPTURES"
          test "$CAMPAIGN" = success && test "$RETAINED" = success && test "$CAPTURES" = success
