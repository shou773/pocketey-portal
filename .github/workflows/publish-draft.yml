name: Publish Pocketey Draft

on:
  workflow_dispatch:
    inputs:
      draft_path:
        description: 'Repository path, e.g. src/content/news/2026-09-05-example.md'
        required: true
        type: string
      confirm:
        description: 'Human approval confirmation'
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'YES'

permissions:
  contents: write

concurrency:
  group: pocketey-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.confirm == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Approve selected draft
        run: python scripts/publish_draft.py "${{ inputs.draft_path }}"

      - name: Validate site build
        run: |
          npm ci
          npm run build

      - name: Commit approved article
        run: |
          if [ -z "$(git status --porcelain -- src/content/news)" ]; then
            echo "No publishable change was produced."
            exit 1
          fi
          git config user.name "pocketey-editorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/news
          git commit -m "Publish reviewed Pocketey article"
          git push
