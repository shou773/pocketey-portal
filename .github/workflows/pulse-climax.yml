name: Pulse authored climax
on:
  pull_request:
    paths:
      - 'src/games/prototypes/shooter/**'
      - 'src/pages/games/pulse-drift.astro'
      - 'tests/prototypes/shooter/**'
      - 'scripts/capture-pulse-climax.mjs'
      - 'scripts/profile-alpine-callbacks.mjs'
      - '.github/workflows/pulse-climax.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  climax:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CI: 'true'
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Preserve accepted integration outside exact-guarded retry help and compact header
        run: git diff --exit-code f39361caddbf992179f21edf62d59925dc214866 HEAD -- src public package.json package-lock.json 'astro.config.*' 'tsconfig*.json' ':(exclude)src/games/orbit-guidance.ts' ':(exclude)src/games/app.ts' ':(exclude)src/games/game.css' ':(exclude)src/games/prototypes/shooter/briefing.ts' ':(exclude)src/games/prototypes/shooter/app.ts'
      - run: npm run check && npm run check:games && npm test && npm run build
      - name: Mark exact source and built file digests
        run: |
          git rev-parse HEAD > dist/preview-source-sha.txt
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-climax-dist-${{ github.event.pull_request.head.sha }}
          path: |
            dist/
            dist-sha256.txt
          retention-days: 14
      - run: npx playwright install --with-deps chromium
      - name: Boss routes, observed loss help and compact lifecycle checks
        id: native
        continue-on-error: true
        run: |
          mkdir -p test-results/pulse-climax
          printf '%s\n' 'Stage1/2 keyboard+touch routes reuse exact999deaa/run37997775310 evidence. The source fence and exact-restoration units preserve all combat/model/rendering code; the reviewed app change only selects observed deadline advice. Existing boss paint and warning identity checks remain intact. Both boss routes, compact/reduced-motion and real context loss rerun on this exact head.' > test-results/pulse-climax/reused-route-scope.txt
          npx playwright test --config tests/prototypes/shooter/climax.config.ts --grep 'stage3|compact|retry, pause'
      - name: Retained Pulse input, language, storage and context checks
        id: retained
        continue-on-error: true
        run: |
          npm run preview -- --host 127.0.0.1 --port 4331 > /tmp/pulse-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in {1..30}; do curl --fail --silent http://localhost:4331/games/pulse-drift/ > /dev/null && break; sleep 1; done
          node tests/prototypes/ui.mjs
      - name: Matched original and authored climax pixels
        id: captures
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/pulse-climax-baseline"
          git archive f39361caddbf992179f21edf62d59925dc214866 | tar -x -C "$RUNNER_TEMP/pulse-climax-baseline"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/pulse-climax-baseline/node_modules"
          (cd "$RUNNER_TEMP/pulse-climax-baseline" && npm run build)
          npx tsx scripts/capture-pulse-climax.mjs "$RUNNER_TEMP/pulse-climax-baseline/dist"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse-climax-evidence
          path: test-results/
          retention-days: 14
      - name: Preserve all verification outcomes
        if: always()
        env:
          NATIVE: ${{ steps.native.outcome }}
          RETAINED: ${{ steps.retained.outcome }}
          CAPTURES: ${{ steps.captures.outcome }}
        run: |
          printf 'native=%s retained=%s captures=%s\n' "$NATIVE" "$RETAINED" "$CAPTURES"
          test "$NATIVE" = success && test "$RETAINED" = success && test "$CAPTURES" = success
