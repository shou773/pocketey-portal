name: Conveyor prototype
on:
  pull_request:
    paths:
      - 'src/games/prototypes/conveyor/**'
      - 'src/pages/prototypes/conveyor.astro'
      - 'tests/prototypes/conveyor/**'
      - 'scripts/capture-conveyor-campaign.mjs'
      - '.github/workflows/conveyor-prototype.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  interaction:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CI: 'true'
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Preserve the other five accepted games
        run: git diff --exit-code a6ad5893df21cf412fd261616d8d1757b27371f6 HEAD -- src/games/model.ts src/games/render.ts src/games/signals.ts src/games/app.ts src/games/game.css src/games/amber-guidance.ts src/components/ActionGame.astro src/games/prototypes/ball src/games/prototypes/alpine src/games/prototypes/shooter
      - run: npm run check && npm run check:games && npm test && npm run build
      - name: Mark exact production source and file digests
        run: |
          git rev-parse HEAD > dist/preview-source-sha.txt
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: six-game-polish-dist-${{ github.event.pull_request.head.sha }}
          path: |
            dist/
            dist-sha256.txt
          retention-days: 14
      - run: npx playwright install --with-deps chromium
      - name: Conveyor ordinary-input campaign and retained regression gates
        id: browser
        continue-on-error: true
        run: npx playwright test --config tests/prototypes/conveyor/playwright.config.ts
      - name: Build immutable three-board campaign source for real before/after captures
        run: |
          mkdir -p "$RUNNER_TEMP/conveyor-baseline"
          git archive a6ad5893df21cf412fd261616d8d1757b27371f6 | tar -x -C "$RUNNER_TEMP/conveyor-baseline"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/conveyor-baseline/node_modules"
          (cd "$RUNNER_TEMP/conveyor-baseline" && npm run build)
          node scripts/capture-conveyor-campaign.mjs "$RUNNER_TEMP/conveyor-baseline/dist"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conveyor-campaign-evidence
          path: test-results/conveyor/
          retention-days: 14
      - name: Preserve browser gate result
        if: always()
        env:
          BROWSER: ${{ steps.browser.outcome }}
        run: test "$BROWSER" = success
